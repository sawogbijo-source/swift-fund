    <script>
      // Gracefully ignore Vite WebSocket HMR errors in iframe dev environments
      window.addEventListener('error', function(e) {
        var str = (e.message || '') + ' ' + (e.filename || '') + ' ' + (e.error ? e.error.stack : '');
        if (str.indexOf('vite') !== -1 || str.indexOf('WebSocket') !== -1 || (e.target && e.target.nodeName === 'SCRIPT' && str.indexOf('@vite') !== -1)) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var str = String(e.reason || '') + ' ' + (e.reason && e.reason.stack ? e.reason.stack : '');
        if (str.indexOf('vite') !== -1 || str.indexOf('WebSocket') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
